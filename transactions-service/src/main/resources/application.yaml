spring:
  application:
    name: transactions-service
  datasource:
    url: jdbc:postgresql://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT}/${TRANSACTION_DB_NAME}
    username: ${TRANSACTION_DB_USER}
    password: ${TRANSACTION_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8081

mock-api:
  base-url: ${MOCK_API_BASE_URL}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080}

brasil-api:
  base-url: ${BRASIL_API_BASE_URL:https://brasilapi.com.br/api}
